<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hive - Workflow Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #f0b429;
    }
    
    .logo span { color: #fff; }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
    }
    
    .stat-label {
      color: #8b949e;
      font-size: 14px;
      margin-top: 5px;
    }
    
    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
      color: #fff;
    }
    
    .workflows-grid {
      display: grid;
      gap: 15px;
    }
    
    .workflow-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .workflow-info h3 {
      color: #fff;
      margin-bottom: 5px;
    }
    
    .workflow-meta {
      color: #8b949e;
      font-size: 13px;
    }
    
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .status-pending { background: #f0b42933; color: #f0b429; }
    .status-running { background: #58a6ff33; color: #58a6ff; }
    .status-complete { background: #3fb95033; color: #3fb950; }
    .status-failed { background: #f8514933; color: #f85149; }
    
    .phase-bar {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }
    
    .phase {
      flex: 1;
      padding: 8px;
      background: #21262d;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      text-transform: uppercase;
    }
    
    .phase.active {
      background: #58a6ff;
      color: #fff;
    }
    
    .phase.done {
      background: #3fb950;
      color: #fff;
    }
    
    .new-workflow {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    
    input, textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
    }
    
    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    
    button:hover { background: #2ea043; }
    
    .agents-section {
      margin-top: 40px;
    }
    
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .agent-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
    }
    
    .agent-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    
    .agent-idle { background: #8b949e; }
    .agent-working { background: #58a6ff; }
    
    .logs-section {
      margin-top: 40px;
    }
    
    .log-entry {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 15px;
      margin-bottom: 8px;
      font-family: monospace;
      font-size: 13px;
    }
    
    .log-time { color: #8b949e; margin-right: 10px; }
    .log-level { 
      padding: 2px 8px; 
      border-radius: 4px; 
      font-size: 11px; 
      margin-right: 10px;
    }
    .log-level-info { background: #58a6ff33; color: #58a6ff; }
    .log-level-error { background: #f8514933; color: #f85149; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🐝 The <span>Hive</span></div>
    <div id="connection-status" style="color: #8b949e;">Connecting...</div>
  </div>
  
  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Workflows</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-running">0</div>
        <div class="stat-label">Running</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-complete">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-agents">0</div>
        <div class="stat-label">Active Agents</div>
      </div>
    </div>
    
    <div class="new-workflow">
      <h3 class="section-title" style="margin-bottom: 15px;">🚀 New Workflow</h3>
      <div class="form-row">
        <input type="text" id="task-input" placeholder="Task description (e.g., 'Fix bug in game')">
        <input type="text" id="repo-input" placeholder="Repository path (e.g., /path/to/repo)">
      </div>
      <button onclick="startWorkflow()">Start Workflow</button>
    </div>
    
    <h3 class="section-title">Workflows</h3>
    <div class="workflows-grid" id="workflows-list">
      <p style="color: #8b949e;">No workflows yet</p>
    </div>
    
    <div class="agents-section">
      <h3 class="section-title">Agents</h3>
      <div class="agents-grid" id="agents-list">
        <p style="color: #8b949e;">No agents registered</p>
      </div>
    </div>
    
    <div class="logs-section">
      <h3 class="section-title">Recent Logs</h3>
      <div id="logs-list">
        <p style="color: #8b949e;">No logs yet</p>
      </div>
    </div>
  </div>
  
  <script>
    let ws = null;
    let workflows = [];
    let agents = [];
    
    // Connect to WebSocket
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      
      ws.onopen = () => {
        document.getElementById('connection-status').textContent = '🟢 Connected';
        document.getElementById('connection-status').style.color = '#3fb950';
      };
      
      ws.onclose = () => {
        document.getElementById('connection-status').textContent = '🔴 Disconnected';
        document.getElementById('connection-status').style.color = '#f85149';
        setTimeout(connect, 3000);
      };
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };
    }
    
    function handleMessage(data) {
      if (data.type === 'workflow-created' || data.type === 'workflow-updated') {
        loadWorkflows();
      }
    }
    
    async function loadWorkflows() {
      const res = await fetch('/api/workflows');
      workflows = await res.json();
      renderWorkflows();
      updateStats();
    }
    
    async function loadAgents() {
      const res = await fetch('/api/agents');
      agents = await res.json();
      renderAgents();
      updateStats();
    }
    
    function renderWorkflows() {
      const container = document.getElementById('workflows-list');
      
      if (workflows.length === 0) {
        container.innerHTML = '<p style="color: #8b949e;">No workflows yet</p>';
        return;
      }
      
      const phases = ['planning', 'setup', 'implementing', 'verifying', 'testing', 'reviewing'];
      
      container.innerHTML = workflows.map(w => `
        <div class="workflow-card">
          <div class="workflow-info">
            <h3>${w.task}</h3>
            <div class="workflow-meta">
              ${w.repo ? w.repo + ' • ' : ''}
              Created ${new Date(w.created_at * 1000).toLocaleString()}
            </div>
            <div class="phase-bar">
              ${phases.map((p, i) => {
                const isActive = w.phase === p && w.status === 'running';
                const isDone = phases.indexOf(w.phase) > i || w.status === 'complete';
                return `<div class="phase ${isActive ? 'active' : ''} ${isDone && !isActive ? 'done' : ''}">${p}</div>`;
              }).join('')}
            </div>
          </div>
          <span class="status-badge status-${w.status}">${w.status}</span>
        </div>
      `).join('');
    }
    
    function renderAgents() {
      const container = document.getElementById('agents-list');
      
      if (agents.length === 0) {
        container.innerHTML = '<p style="color: #8b949e;">No agents registered</p>';
        return;
      }
      
      container.innerHTML = agents.map(a => `
        <div class="agent-card">
          <div style="display: flex; align-items: center; margin-bottom: 8px;">
            <span class="agent-status agent-${a.status}"></span>
            <strong>${a.name}</strong>
          </div>
          <div style="color: #8b949e; font-size: 12px;">
            ${a.status === 'idle' ? 'Waiting for work' : a.current_task || 'Working...'}
          </div>
        </div>
      `).join('');
    }
    
    function updateStats() {
      document.getElementById('stat-total').textContent = workflows.length;
      document.getElementById('stat-running').textContent = workflows.filter(w => w.status === 'running' || w.status === 'pending').length;
      document.getElementById('stat-complete').textContent = workflows.filter(w => w.status === 'complete').length;
      document.getElementById('stat-agents').textContent = agents.filter(a => a.status === 'working').length;
    }
    
    async function startWorkflow() {
      const task = document.getElementById('task-input').value;
      const repo = document.getElementById('repo-input').value;
      
      if (!task) return alert('Task is required');
      
      const id = Date.now().toString();
      
      await fetch('/api/workflows', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, task, repo })
      });
      
      document.getElementById('task-input').value = '';
      document.getElementById('repo-input').value = '';
    }
    
    // Initialize
    connect();
    loadWorkflows();
    loadAgents();
    
    // Refresh periodically
    setInterval(() => {
      loadWorkflows();
      loadAgents();
    }, 5000);
  </script>
</body>
</html>
